function choose(obj){
  if(!obj)return;
  obj.userData.pop=1; /* efeito visual ao selecionar; aqui entra a ação: obj.userData.id = campaign, solo, online, party, settings, help, edit, back */
}

/* ---------- laser azul ---------- */
var menuAlpha=0;
var ray=new THREE.Raycaster(),tmpD=new THREE.Vector3(),tmpT=new THREE.Vector3();
function makeBeam(){
  var g=new THREE.CylinderGeometry(0.004,0.004,1,8);g.rotateX(Math.PI/2);g.translate(0,0,0.5);
  var b=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:BLUE,transparent:true,opacity:0.9}));
  var d=new THREE.Mesh(new THREE.SphereGeometry(0.015,12,12),new THREE.MeshBasicMaterial({color:0x9fd8ff}));
  b.visible=d.visible=false;scene.add(b);scene.add(d);
  return {beam:b,dot:d,hover:null};
}
function aim(bm,origin,dir){
  ray.set(origin,dir);ray.far=8;
  var hit=menuAlpha>0.9?ray.intersectObjects(items,false)[0]:null;
  var dist=hit?hit.distance:3;
  bm.hover=hit?hit.object:null;
  bm.beam.visible=bm.dot.visible=menuAlpha>0.05;
  bm.beam.position.copy(origin);
  tmpT.copy(origin).add(tmpD.copy(dir).multiplyScalar(dist));
  bm.beam.lookAt(tmpT);bm.beam.scale.z=dist;bm.dot.position.copy(tmpT);
}
var xrBeams=[0,1].map(function(i){
  var c=renderer.xr.getController(i);scene.add(c);
  var bm=makeBeam();bm.ctl=c;
  c.addEventListener('selectstart',function(){choose(bm.hover);});
  return bm;
});
var deskBeam=makeBeam();

/* ---------- olhar em volta: giroscópio + arrastar ---------- */
var gyro={on:false,a:0,b:0,g:0,a0:null},yaw=0,pitch=0,sensorQ=null,sensorYaw0=null;
function onOri(e){
  if(e.beta==null||e.gamma==null)return;
  var al=e.alpha==null?0:e.alpha;
  if(gyro.a0===null)gyro.a0=al;
  gyro.a=al;gyro.b=e.beta;gyro.g=e.gamma;
  if(!gyro.on){gyro.on=true;hideGyroBtn();}
}
function listenGyro(){
  removeEventListener('deviceorientation',onOri);
  removeEventListener('deviceorientationabsolute',onOri);
  addEventListener('deviceorientation',onOri);
  addEventListener('deviceorientationabsolute',function(e){if(!gyro.on)onOri(e);});
}
listenGyro();
var gyroGranted=false,askPending=false;
function askGyro(){
  if(gyroGranted||gyro.on||askPending)return;
  var DO=window.DeviceOrientationEvent,DM=window.DeviceMotionEvent;
  if(DO&&typeof DO.requestPermission==='function'){
    askPending=true;
    DO.requestPermission().then(function(r){
      askPending=false;
      if(r==='granted'){gyroGranted=true;listenGyro();
        if(DM&&typeof DM.requestPermission==='function')DM.requestPermission().catch(function(){});
        setGyroMsg('Mexa o celular para olhar em volta');
      }else setGyroMsg('Permissão negada. Feche a aba, abra de novo e toque em Permitir.');
    }).catch(function(){askPending=false;setGyroMsg('Não consegui ativar. Abra o jogo em https no Safari.');});
  }else{gyroGranted=true;listenGyro();}
}
function setGyroMsg(){}
function hideGyroBtn(){}
addEventListener('touchend',askGyro);
addEventListener('click',askGyro);
addEventListener('pointerup',askGyro);
addEventListener('touchstart',function(){},{passive:true});
/* plano B (Android): sensores direto, se o evento normal não vier */
function startSensor(kind){
  try{
    if(!(kind in window))return false;
    var sen=new window[kind]({frequency:60,referenceFrame:'screen'});
    sen.addEventListener('reading',function(){
      if(gyro.on)return;
      var q=sen.quaternion;if(!q)return;
      if(!sensorQ)sensorQ=new THREE.Quaternion();
      sensorQ.set(q[0],q[1],q[2],q[3]);
    });
    sen.addEventListener('error',function(){if(!sensorQ&&kind==='RelativeOrientationSensor')startSensor('AbsoluteOrientationSensor');});
    sen.start();return true;
  }catch(err){
    if(kind==='RelativeOrientationSensor')return startSensor('AbsoluteOrientationSensor');
    return false;
  }
}
setTimeout(function(){if(!gyro.on)startSensor('RelativeOrientationSensor');},800);
var rxm90=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),-Math.PI/2);
var zee=new THREE.Vector3(0,0,1),upV=new THREE.Vector3(0,1,0),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.SQRT1_2,0,0,Math.SQRT1_2),eul=new THREE.Euler(),qq=new THREE.Quaternion(),yawQ=new THREE.Quaternion();
function screenAngle(){var a=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);return a*Math.PI/180;}
var pitchQ=new THREE.Quaternion(),xAxis=new THREE.Vector3(1,0,0),baseQ=new THREE.Quaternion();
function updateLook(){
  /* base = giroscópio (só muda quando GIRA o celular) */
  if(gyro.on){
    var D=Math.PI/180;
    eul.set(gyro.b*D,(gyro.a-gyro.a0)*D,-gyro.g*D,'YXZ');
    baseQ.setFromEuler(eul);baseQ.multiply(q1);baseQ.multiply(q0.setFromAxisAngle(zee,-screenAngle()));
    yawQ.setFromAxisAngle(upV,yaw);
  }else if(sensorQ){
    baseQ.copy(rxm90).multiply(sensorQ);
    if(sensorYaw0===null){eul.setFromQuaternion(baseQ,'YXZ');sensorYaw0=eul.y;}
    yawQ.setFromAxisAngle(upV,yaw-sensorYaw0);
  }else{
    baseQ.identity();
    yawQ.setFromAxisAngle(upV,yaw);
  }
  /* toque/arrastar na tela = só mexe a visão (yaw/pitch), separado do giroscópio */
  pitchQ.setFromAxisAngle(xAxis,pitch);
  camera.quaternion.copy(yawQ).multiply(pitchQ).multiply(baseQ);
  camera.updateMatrixWorld(true);
}

var mouse=new THREE.Vector2(0,0),down=null,dragged=false;
function setMouse(e){mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;}
/* mouse (PC): usa pointer events só para mouse */
addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;setMouse(e);down={x:e.clientX,y:e.clientY};dragged=false;});
addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse')return;
  setMouse(e);
  if(down&&!dragged&&Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>10)dragged=true;
});
addEventListener('pointerup',function(e){
  if(e.pointerType!=='mouse')return;
  if(down&&!dragged&&!renderer.xr.isPresenting){setMouse(e);update(performance.now());choose(deskBeam.hover);}
  down=null;
});
/* celular: 1 dedo = apontar a luz azul (usa só o primeiro dedo, sem precisar de 2) */
var tid=null;
function findT(list){for(var i=0;i<list.length;i++)if(list[i].identifier===tid)return list[i];return null;}
addEventListener('touchstart',function(e){
  if(tid!==null)return;
  var t=e.changedTouches[0];tid=t.identifier;
  setMouse(t);down={x:t.clientX,y:t.clientY};dragged=false;
},{passive:false});
addEventListener('touchmove',function(e){
  if(e.cancelable)e.preventDefault();
  var t=findT(e.changedTouches);if(!t)return;
  setMouse(t);
  if(down&&!dragged&&Math.abs(t.clientX-down.x)+Math.abs(t.clientY-down.y)>10)dragged=true;
},{passive:false});
function endTouch(e,ok){
  var t=findT(e.changedTouches);if(!t)return;
  if(ok&&down&&!dragged&&!renderer.xr.isPresenting){setMouse(t);update(performance.now());choose(deskBeam.hover);}
  down=null;tid=null;
}
addEventListener('touchend',function(e){endTouch(e,true);},{passive:false});
addEventListener('touchcancel',function(e){endTouch(e,false);},{passive:false});

/* ---------- animação ---------- */
var t0=performance.now();
function update(now){
  var t=(now-t0)/1000,fade=ramp(t,1,3);
  sky.material.opacity=fade;stars.material.opacity=fade;titleMat.opacity=fade;
  menuAlpha=ramp(t,3.2,4.2);
  items.forEach(function(p){
    var hov=(deskBeam.hover===p)||xrBeams.some(function(b){return b.hover===p;});
    var u=p.userData,c=p.material.color,tc=hov?1:0.62;u.pop=Math.max(0,(u.pop||0)-0.05);var k=(hov?1.06:1)-0.08*u.pop;
    p.material.opacity=menuAlpha;
    c.setScalar(c.r+(tc-c.r)*0.2);
    u.group.scale.x+=(k-u.group.scale.x)*0.25;u.group.scale.y=u.group.scale.x;
  });

  if(renderer.xr.isPresenting){
    deskBeam.beam.visible=deskBeam.dot.visible=false;
    xrBeams.forEach(function(bm){
      var c=bm.ctl;c.updateMatrixWorld(true);
      var o=new THREE.Vector3(),q=new THREE.Quaternion();
      c.getWorldPosition(o);c.getWorldQuaternion(q);
      aim(bm,o,new THREE.Vector3(0,0,-1).applyQuaternion(q));
    });
  }else{
    xrBeams.forEach(function(b){b.beam.visible=b.dot.visible=false;});
    updateLook();
    ray.setFromCamera(mouse,camera);
    var tgt=ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(3));
    var hand=new THREE.Vector3(0.3,-0.45,-0.4).applyMatrix4(camera.matrixWorld);
    aim(deskBeam,hand,tgt.sub(hand).normalize());
  }
}
renderer.setAnimationLoop(function(now){update(now);renderer.render(scene,camera);});
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

})();
</script>
